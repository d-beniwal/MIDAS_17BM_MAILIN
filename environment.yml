# Conda environment for the mail-in scan-request GUI (mailin.py,
# beamline17bm_real.py). Calibration/integration is NOT in this env: it runs
# in the separate `midas_mailin` env (github/midas_mailin) via subprocess.
#
# Create:   conda env create -f environment.yml
# Update:   conda env update -f environment.yml --prune
# Activate: conda activate mailin
name: mailin
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.4.6
      - PyQt5==5.15.11
      - pyepics==3.5.10
      - SQLAlchemy==2.0.52
      - mysql-connector-python==26.7.0
      - pandas==3.0.5
      - Pillow==12.3.0
